<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTA VI Orders</title><style>*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fff;font-family:Arial}header{padding:20px 7%;border-bottom:1px solid #29292d;display:flex;justify-content:space-between}.logo{color:#f4c542;font-weight:900;letter-spacing:2px}.tag{color:#999;font-size:12px}main{max-width:1050px;margin:auto;padding:40px 20px;display:grid;grid-template-columns:1fr 1fr;gap:30px}.hero h1{font-size:50px}.hero p{color:#bbb;line-height:1.7}.cover{height:250px;border-radius:18px;background:linear-gradient(135deg,#7a294d,#e0a83a,#123);display:flex;align-items:end;padding:25px;font-size:38px;font-weight:900}.card{background:#151519;border:1px solid #303037;border-radius:18px;padding:25px}label{display:block;margin:12px 0 6px;color:#ccc}input,textarea,select{width:100%;padding:13px;border-radius:8px;border:1px solid #444;background:#0c0c0f;color:#fff}textarea{min-height:75px}.price{font-size:28px;color:#f4c542;margin-top:18px}button{width:100%;padding:15px;margin-top:18px;border:0;border-radius:8px;background:#f4c542;font-weight:900}.ok{display:none;background:#173b25;padding:14px;margin-top:15px;border-radius:8px}@media(max-width:800px){main{grid-template-columns:1fr}.hero h1{font-size:40px}}</style></head><body><header><div class="logo">GTA VI ORDERS</div><div class="tag">INDEPENDENT RETAILER</div></header><main><section class="hero"><div class="cover">GTA VI</div><h1>Reserve your copy.</h1><p>Place an independent retail order request for GTA VI.</p><p><b>Notice:</b> This website is not affiliated with, endorsed by, or sponsored by Rockstar Games or Take-Two Interactive.</p></section><section class="card"><h2>Checkout</h2><label>Full name</label><input id="name"><label>Email</label><input id="email" type="email"><label>Phone</label><input id="phone" placeholder="+254..."><label>Delivery address</label><textarea id="address"></textarea><label>Quantity</label><select id="quantity"><option>1</option><option>2</option><option>3</option></select><label>Payment</label><select id="payment"><option value="mpesa">M-Pesa</option><option value="paypal">PayPal</option></select><div class="price">KSh <span id="total">7,500</span></div><button onclick="order()">Place order</button><div id="ok" class="ok"></div></section></main><script>quantity.onchange=()=>total.textContent=(7500*quantity.value).toLocaleString();async function order(){let d={name:name.value,email:email.value,phone:phone.value,address:address.value,quantity:quantity.value,paymentMethod:payment.value};if(Object.values(d).some(x=>!x)){alert("Complete all fields");return}let r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)return alert(j.error);ok.style.display="block";ok.innerHTML=`Order <b>${j.orderId}</b> created.<br>Total: KSh ${j.amount.toLocaleString()}<br>Payment: Pending`;}</script></body></html>
